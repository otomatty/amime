# ローカルのGitフック。CIと同じ検査を、速いものから順に手元でも実行する。
# 設定の説明: https://lefthook.dev/configuration/

pre-commit:
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test
