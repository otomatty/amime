name: CI

# PRごとに、検査を一通り行う。main に入ったあとの検査は、Deploy(deploy.yml)が、このファイルを呼んで行う。
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  static:
    name: 規約(lint / 型 / 未使用コード / テスト先行)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # テスト先行の検査でベースブランチとの差分を取るため、履歴をすべて取得する。
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint と整形
        run: pnpm lint
      - name: 型検査
        run: pnpm typecheck
      - name: 未使用のコードと依存
        run: pnpm check:unused
      # ワークフローの書き間違い(式、ジョブの依存、run の中のシェル)を検査する。シェルの検査(shellcheck)も、この中で行う。
      - name: ワークフローの記述
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
      # 本番で使う依存に、深刻度が high 以上の既知の脆弱性がないこと。開発にだけ使う依存は、Dependabot の通知で扱う。
      - name: 依存の脆弱性
        run: pnpm audit --prod --audit-level high
      - name: PRタイトルの規約
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: テスト先行の規約
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
          COMMIT_HEADER: ${{ github.event.pull_request.title }}
        run: pnpm check:tdd

  unit:
    name: 単体テストとカバレッジ
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage

  server:
    name: サーバーのテスト(Workers ランタイム)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:server

  build:
    name: ビルドとデプロイ検証(dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      # 開発用のログイン(名前を入れるだけでログインできる)は、公開環境では無効にする(ADR-0032)。
      - name: 本番用のビルドで開発用のログインが無効であることを確認
        run: grep -q '"DEV_LOGIN":{"type":"text","value":"disabled"}' apps/web/.cloudflare/output/v0/workers/default/worker.config.json
      # プロジェクトを作れる人は、公開環境では、シークレットで渡す(誰でも作れる設定を、埋め込まない。ADR-0033)。
      - name: 本番用のビルドでプロジェクトを作れる人が埋め込まれていないことを確認
        run: grep -q '"PROJECT_CREATORS":{"type":"secret"}' apps/web/.cloudflare/output/v0/workers/default/worker.config.json
      - name: アップロードせずにデプロイ内容を検証
        run: pnpm --filter @tsuzuri/web exec cf deploy --prebuilt --mode production --dry-run
      # 画面のJS・CSSと、Worker の大きさ(gzip)が、上限を超えていないこと。結果は、ジョブの概要に表で出る。
      - name: 配信するファイルの大きさ
        run: pnpm check:size

  # ブラウザごとに、並べて動かす。スマートフォンの設定(画面の作りと主な画面)は、同じエンジンのジョブで動かす。
  # Chromium の機能を使うテスト(@chromium)は、Chromium だけで動く(e2e/playwright.config.ts)。
  e2e:
    name: E2Eテスト(${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: --project=chromium --project=mobile-chrome
            # Chromium の実行に必要なライブラリは、ランナーのイメージに入っている。apt の更新は、長く待たされることがあるので、しない。
            deps: false
          - browser: firefox
            projects: --project=firefox
            deps: true
          - browser: webkit
            projects: --project=webkit --project=mobile-safari
            deps: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: ブラウザをインストール
        env:
          BROWSER: ${{ matrix.browser }}
          DEPS: ${{ matrix.deps }}
        run: |
          if [ "$DEPS" = "true" ]; then
            pnpm --filter @tsuzuri/e2e exec playwright install --with-deps "$BROWSER"
          else
            pnpm --filter @tsuzuri/e2e exec playwright install "$BROWSER"
          fi
      # 開発用のログインを使えるE2E用のビルド(--mode e2e)を作ってから実行する。
      - name: E2Eテスト
        env:
          PROJECTS: ${{ matrix.projects }}
        # PROJECTS は「--project=…」を空白で区切ったもの。分けて渡すため、引用符で囲まない。
        run: |
          # shellcheck disable=SC2086
          pnpm test:e2e $PROJECTS
      # 失敗したときは、画面の記録(trace)と報告を、成果物として残す。Actions の実行の画面から、取り出せる。
      - name: 失敗したときの記録を残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.browser }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  # 上の検査が、すべて通ったか。ブランチ保護では、この1つだけを必須にすればよい(docs/deploy.md の 1)。
  # 検査が増えても、ブランチ保護の設定を変えずに済む。
  all:
    name: すべての検査
    if: always()
    needs: [static, unit, server, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 結果を確かめる
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  # PRの内容を、プレビュー環境(ブランチ名のURL)に出す。リポジトリ変数 PREVIEW_ENABLED が "true" のときだけ動く。
  # 既定では、動かさない(docs/deploy.md の 5)。フォークと Dependabot のPRには、シークレットが渡らないので、対象にしない。
  preview:
    name: プレビュー環境へデプロイ
    if: >-
      github.event_name == 'pull_request' &&
      vars.PREVIEW_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: [static, unit, server, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter @tsuzuri/web exec cf previews deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
