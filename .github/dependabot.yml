version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      cloudflare:
        patterns: ["cf", "@cloudflare/*"]
      test:
        patterns:
          [
            "vitest",
            "@vitest/*",
            "@playwright/test",
            "fast-check",
            "@testing-library/*",
            "happy-dom",
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
